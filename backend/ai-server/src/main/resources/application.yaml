spring:
  application:
    name: haze-ai-hub
  profiles:
    active: dev
  ai:
    dashscope:
      api-key: ${ai.bailian.api-key}
      chat:
        options:
          model: deepseek-v3
          temperature: 0.8
      embedding:
        options:
          model: text-embedding-v4 # 文本向量
#          model: qwen2.5-vl-embedding # 多模态向量模型
    wanx:
      model: wanxFLUX
      endpoint: https://dashscope.aliyuncs.com/api/v1/services/a2xlvm9xb7tx/image%20generation
      timeout: 60000
    ai:
      vectorstore:
  rocketmq:
    namesrv-addr: ${ai.rocketmq.namesrv-addr:localhost:9876}
    producer:
      group: astra-parse-producer-group
    # 自动创建 Topic（需 Broker 开启 autoCreateTopicEnable=true）
    auto-create-topics: true
  datasource:
    url: jdbc:postgresql://${ai.datasource.host:localhost}:${ai.datasource.port:5432}/${ai.datasource.database:haze-ai-hub}?sslmode=disable
    driver-class-name: ${ai.datasource.driver-class-name:org.postgresql.Driver}
    username: ${ai.datasource.username:postgres}
    password: ${ai.datasource.password:1234}
  data:
    redis:
      host: ${ai.redis.host:localhost}
      port: ${ai.redis.port:6379}
      password: ${ai.redis.password:}
      timeout: ${ai.redis.timeout:10000}
      database: ${ai.redis.database:2}

logging:
  level:
    org.springframework.ai.chat.client.advisor: debug
    top.hazenix.hazeaihub: debug

# Actuator metrics
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    enable:
      http.server.requests: true

mybatis-plus:
  #mapper配置文件
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: top.hazenix.hazeaihub.entity # 别名扫描包(项目中实体类放置的包路径)
  configuration:
    #开启驼峰和下划线的映射
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: false # 是否开启二级缓存
    # 配置默认的JDBC类型映射
    jdbc-type-for-null: NULL
  global-config:
    db-config:
      id-type: AUTO # 设置全局的id生成策略
      update-strategy: not_null # 设置更新策略：只更新非空字段
  # 配置类型处理器
  type-handlers-package: top.hazenix.hazeaihub.handler
# Knife4j和SpringDoc配置
springdoc:
  api-docs:
    enabled: true
    path: /v1/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-flat-param-object: false

knife4j:
  enable: true
  production: false

# Astra 知识库配置
astra:
  enabled: true
  upload:
    max-file-size: 100
    allowed-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - audio/mpeg
      - audio/wav
      - application/x-xmind
      - text/plain
  embedding:
    model: text-embedding-v3
    dimensions: 1024
    max-tokens: 8192
  rocketmq:
    namesrv-addr: ${ai.rocketmq.namesrv-addr:localhost:9876}
  setting:
    language: zh-cn
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表
    enable-version: false
    enable-reload-cache-parameter: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-apis: false
    enable-request-cache: true
    enable-host: false
    enable-host-text: ""
    enable-home-custom: false
    home-custom-path: classpath:markdown/home.md
    enable-search: true
    enable-footer: true
    enable-footer-custom: false
    footer-custom-content: ""
    enable-dynamic-parameter: false
    enable-debug: true
    enable-open-api: true
    enable-group: true
  query-rewrite:
    enabled: true
    model: qwen-flash
    max-tokens: 128
    temperature: 0.3
  search:
    top-k:
      bm25: 50
      vector: 50
    # RRF 合并后的输出数量，取前 N 个送入 ReRank
    rrf-output-top-k: 30
    # RRF 平滑因子，值越大则高排名与低排名的分差越小（通常取 60）
    rrf-k: 60
    # pgvector HNSW iterative scan 候选集大小，配合 relaxed_order 使用
    # 值越大召回越准，但查询耗时增加；建议范围 100~400，按实际数据量调整
    ef-search: 200
  rerank:
    enabled: true
    model: qwen3-rerank
    top-k: 10